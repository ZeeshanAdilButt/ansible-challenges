---
# A playbook with a lint problem, on purpose: the first task has no name, and the command task
# has no changed_when. The pipeline must stop at the lint stage.
- name: The guard
  ansible.builtin.import_playbook: guard.yml

- name: Put the banner on the web hosts
  hosts: web
  become: true
  tasks:
    - ansible.builtin.command: echo hello
      register: said
