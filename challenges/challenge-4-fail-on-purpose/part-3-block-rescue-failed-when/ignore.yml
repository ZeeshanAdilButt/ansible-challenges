---
# Version 2: ignore the error.
- name: Read the app version, ignoring errors
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the app version
      ansible.builtin.command: cat /srv/app/version
      register: app_version
      changed_when: false
      # TODO: keep going when this task fails (one line: ignore_errors).

    - name: Announce the deploy
      ansible.builtin.debug:
        msg: "Deploy finished on {{ inventory_hostname }}"
