# The rollout fleet (six web hosts and the database host), with SSH connection sharing OFF.
# Same hosts as inventory/rollout.ini. Only one step of the drill uses this file.
#
# By default Ansible keeps its first SSH connection to a host open for 60 seconds and
# re-uses it (that is called ControlMaster and ControlPersist). With sharing off,
# every task opens a new connection.
[web]
web1
web2
web3
web4
web5
web6

[db]
db1

[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=/home/learner/.ssh/id_ed25519
ansible_ssh_args=-o ControlMaster=no -o ControlPath=none
