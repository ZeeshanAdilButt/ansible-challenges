# Your first playbook. A playbook is a list of plays. A play says which hosts to use
# and what tasks to run on them, in order. Each task calls one module.
#
# Read it top to bottom. The first task is written for you. The TODO lines are yours.

- name: Web servers
  hosts: web
  become: true # run every task here with sudo
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

