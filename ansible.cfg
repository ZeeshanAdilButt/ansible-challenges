# Ansible reads this file because the control container sets ANSIBLE_CONFIG=/work/ansible.cfg.
# (Ansible ignores an ansible.cfg that sits in a world-writable folder, and a folder
# shared from Windows looks world-writable. Pointing ANSIBLE_CONFIG at it avoids that.)

[defaults]
inventory = inventory/fleet.ini
# The targets are made fresh by "fleet reset", so their host keys change every time.
# A real server keeps its key, and there you leave host key checking ON.
host_key_checking = False
# Find the Python on each target without printing the "discovered interpreter" warning.
interpreter_python = auto_silent
# Do not write *.retry files next to playbooks.
retry_files_enabled = False
# Where "ansible-galaxy collection install -p collections" puts collections (challenge 5).
collections_path = collections
